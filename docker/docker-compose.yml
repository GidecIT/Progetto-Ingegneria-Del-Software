x-backend-port: &backend-port "5050"

x-mysql-database: &mysql-database "participium"
x-mysql-user: &mysql-user "participium"
x-mysql-password: &mysql-password "participium_password"
x-mysql-root-password: &mysql-root-password "participium_root_password"

x-mysql-credentials: &mysql-credentials
  MYSQL_DATABASE: *mysql-database
  MYSQL_USER: *mysql-user
  MYSQL_PASSWORD: *mysql-password
  MYSQL_ROOT_PASSWORD: *mysql-root-password

services:
  database:
    image: mysql:8
    container_name: participium-database
    environment:
      <<: *mysql-credentials
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql -h 127.0.0.1 -uparticipium -pparticipium_password participium -e 'SELECT 1' >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - participium

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: participium-backend
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql+pymysql://participium:participium_password@database:3306/participium?autocommit=true"
      HOST: "0.0.0.0"
      PORT: *backend-port
      FLASK_ENV: "development"
      SECRET_KEY: "participium-dev-secret"
      FRONTEND_ORIGIN: "http://localhost:5173"
      AUTO_INIT_DB: "true"
      BOOTSTRAP_REFERENCE_DATA: "true"
      BOOTSTRAP_DEMO_DATA: "true"
    ports:
      - "5050:5050"
    volumes:
      - ../src/backend:/usr/src/app
      - backend_instance:/usr/src/app/instance
      - backend_media:/usr/src/app/participium/static/uploads
    networks:
      - participium

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: participium-frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: "http://localhost:5050/api/v1"
      VITE_BACKEND_BASE_URL: "http://localhost:5050"
    ports:
      - "5173:5173"
    volumes:
      - ../src/frontend:/usr/src/app
      - frontend_node_modules:/usr/src/app/node_modules
    networks:
      - participium

volumes:
  mysql_data:
  backend_instance:
  backend_media:
  frontend_node_modules:

networks:
  participium:
    driver: bridge
